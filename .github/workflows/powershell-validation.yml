name: PowerShell validation

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  analyze:
    name: Run PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\.github\linters\PSScriptAnalyzerSettings.psd1 -Severity Error,Warning -EnableExit
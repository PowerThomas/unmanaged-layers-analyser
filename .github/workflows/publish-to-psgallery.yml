name: Publish to PowerShell Gallery

# Triggers on a version tag push (e.g. v1.0.0, v1.2.3)
# Also supports manual trigger via GitHub Actions UI
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish script to PSGallery
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PSScriptInfo version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $info = Test-ScriptFileInfo -Path .\Get-UnmanagedLayers.ps1
          if ($info.Version -ne $tag) {
            Write-Error "Tag version '$tag' does not match PSScriptInfo version '$($info.Version)'. Update the .VERSION in the script before tagging."
            exit 1
          }
          Write-Host "Version check passed: $tag"

      - name: Publish to PowerShell Gallery
        shell: pwsh
        run: |
          Publish-Script `
            -Path           .\Get-UnmanagedLayers.ps1 `
            -NuGetApiKey    ${{ secrets.PSGALLERY_API_KEY }} `
            -Verbose
